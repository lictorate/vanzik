
  # --- Cursor ---
  # Rules for Cursor's tool calls, which `vanzik hook cursor`
  # checks as agent "cursor" (connect it with `vanzik setup`). A
  # coding agent works on your real project, so the sandbox rules above would
  # block most of its work: these replace them for Cursor only, scope by
  # scope. Scopes not listed here (mcp_tool, browser) keep the rules above.
  # "replace" drops the base deny and approval lists for the scopes below
  # (the default "merge" keeps them), so everyday commands such as
  # `python -m pytest` don't wait for approval; each scope's own lists here
  # are complete on their own.
  cursor:
    override_mode: replace
    override:
      - scope: filesystem
        deny:
          - action: read
            paths: ["**/.ssh/**", "**/.aws/**", "**/.gnupg/**"]
            message: "Keys and cloud credentials are off-limits to Cursor"
          - action: write
            paths: ["**/.ssh/**", "**/.aws/**", "**/.gnupg/**", "/etc/**", "/usr/**", "C:/Windows/**"]
            message: "Cursor doesn't write to system folders or credentials"
          # Vanzik's own files: the API key that can approve a pending action,
          # and the policy that decides what Cursor may do. Only the
          # default folder is named; one moved with XDG_CONFIG_HOME is not.
          - action: read
            paths: ["**/.config/vanzik/**", "**/AppData/Roaming/vanzik/**"]
            message: "Vanzik's config folder (API key, policy) is off-limits to Cursor"
          - action: write
            paths: ["**/.config/vanzik/**", "**/AppData/Roaming/vanzik/**"]
            message: "Vanzik's config folder (API key, policy) is off-limits to Cursor"
          # The hook files `vanzik setup` writes. Removing Vanzik's entry
          # turns the checks off. A project's own .claude/settings.json
          # matches too.
          - action: write
            paths: ["**/.claude/settings.json", "**/.cursor/hooks.json", "**/.gemini/settings.json", "**/.codex/hooks.json"]
            message: "The hook settings that connect Vanzik are off-limits to Cursor"
        require_approval:
          - action: read
            paths: ["**/.env", "**/.env.*"]
          - action: write
            paths: ["**/.env", "**/.env.*"]
        allow:
          - action: read
            paths: ["**"]
          - action: write
            paths: ["**"]

      - scope: shell
        deny:
          - pattern: ":(){ :|:& };:"
          - pattern: "dd if=/dev/*"
          - pattern: "> /dev/sda"
          # Vanzik's control plane. An agent that can approve its own pending
          # action, read the saved API key or stop the server makes the
          # checks optional. These are glob matches on the command text, so
          # a determined agent can write the same call another way (a
          # script, a variable); they stop the plain forms, not a determined agent.
          - pattern: "*/v1/approve/*"
            message: "Approving actions is for you, not Cursor"
          - pattern: "*/v1/deny/*"
            message: "Denying actions is for you, not Cursor"
          - pattern: "*/v1/audit*"
            message: "Vanzik's audit endpoint is off-limits to Cursor"
          - pattern: "*/v1/t/*/approve/*"
            message: "Approving actions is for you, not Cursor"
          - pattern: "*/v1/t/*/deny/*"
            message: "Denying actions is for you, not Cursor"
          - pattern: "*/v1/t/*/audit*"
            message: "Vanzik's audit endpoint is off-limits to Cursor"
          - pattern: "vanzik approve*"
            message: "Approving actions is for you, not Cursor"
          - pattern: "*/vanzik approve*"
            message: "Approving actions is for you, not Cursor"
          - pattern: "*vanzik.exe approve*"
            message: "Approving actions is for you, not Cursor"
          - pattern: "vanzik deny*"
            message: "Denying actions is for you, not Cursor"
          - pattern: "*/vanzik deny*"
            message: "Denying actions is for you, not Cursor"
          - pattern: "*vanzik.exe deny*"
            message: "Denying actions is for you, not Cursor"
          - pattern: "*/.config/vanzik*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Cursor"
          - pattern: "*/vanzik/api-key*"
            message: "Vanzik's API key is off-limits to Cursor"
          - pattern: "*AppData*vanzik*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Cursor"
          - pattern: "*APPDATA*vanzik*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Cursor"
          # Only commands that name vanzik: `kill 1234` and `pkill node` stay
          # allowed.
          - pattern: "kill *vanzik*"
            message: "Stopping Vanzik is off-limits to Cursor"
          - pattern: "pkill *vanzik*"
            message: "Stopping Vanzik is off-limits to Cursor"
          - pattern: "killall *vanzik*"
            message: "Stopping Vanzik is off-limits to Cursor"
          - pattern: "taskkill *vanzik*"
            message: "Stopping Vanzik is off-limits to Cursor"
          - pattern: "launchctl *vanzik*"
            message: "Stopping Vanzik is off-limits to Cursor"
          - pattern: "systemctl *vanzik*"
            message: "Stopping Vanzik is off-limits to Cursor"
        require_approval:
          - pattern: "sudo *"
          - pattern: "rm -rf *"
          - pattern: "rm -fr *"
          - pattern: "git push --force*"
          - pattern: "git push -f*"
          - pattern: "git reset --hard*"
          - pattern: "git clean -*"
          - pattern: "curl * | *sh"
          - pattern: "wget * | *sh"
          - pattern: "chmod 777 *"
          - pattern: "Remove-Item * -Recurse*"
        allow:
          - pattern: "*"

      - scope: network
        deny:
          - domain: "169.254.169.254"
            message: "Cloud metadata endpoints are off-limits"
          - domain: "metadata.google.internal"
            message: "Cloud metadata endpoints are off-limits"
          - domain: "metadata"
            message: "Cloud metadata endpoints are off-limits"
          - domain: "fd00:ec2::254"
            message: "Cloud metadata endpoints are off-limits"
        allow:
          - domain: "*"
