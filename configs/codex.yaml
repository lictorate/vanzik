
  # --- Codex CLI ---
  # Rules for Codex CLI's tool calls, which `vanzik hook codex`
  # checks as agent "codex" (connect it with `vanzik setup`). A
  # coding agent works on your real project, so the sandbox rules above would
  # block most of its work: these replace them for Codex CLI only, scope by
  # scope. Scopes not listed here (mcp_tool, browser) keep the rules above.
  # "replace" drops the base deny and approval lists for the scopes below
  # (the default "merge" keeps them), so everyday commands such as
  # `python -m pytest` don't wait for approval; each scope's own lists here
  # are complete on their own.
  codex:
    override_mode: replace
    override:
      - scope: filesystem
        deny:
          - action: read
            paths: ["**/.ssh/**", "**/.aws/**", "**/.gnupg/**"]
            message: "Keys and cloud credentials are off-limits to Codex CLI"
          - action: write
            paths: ["**/.ssh/**", "**/.aws/**", "**/.gnupg/**", "/etc/**", "/usr/**", "C:/Windows/**"]
            message: "Codex CLI doesn't write to system folders or credentials"
          # Vanzik's own files: the API key that can approve a pending action,
          # and the policy that decides what Codex CLI may do. Only the
          # default folder is named; one moved with XDG_CONFIG_HOME is not.
          - action: read
            paths: ["**/.config/vanzik/**", "**/AppData/Roaming/vanzik/**"]
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - action: write
            paths: ["**/.config/vanzik/**", "**/AppData/Roaming/vanzik/**"]
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          # The hook files `vanzik setup` writes. Removing Vanzik's entry
          # turns the checks off. A project's own .claude/settings.json
          # matches too. This covers the file tools and shell redirections
          # only: `cp`, an editor, or a folder moved with CLAUDE_CONFIG_DIR,
          # CURSOR_CONFIG_DIR, GEMINI_CLI_HOME or CODEX_HOME get past it.
          - action: write
            paths: ["**/.claude/settings.json", "**/.cursor/hooks.json", "**/.gemini/settings.json", "**/.codex/hooks.json"]
            message: "The hook settings that connect Vanzik are off-limits to Codex CLI"
        require_approval:
          - action: read
            paths: ["**/.env", "**/.env.*"]
          - action: write
            paths: ["**/.env", "**/.env.*"]
        allow:
          - action: read
            paths: ["**"]
          - action: write
            paths: ["**"]

      - scope: shell
        deny:
          - pattern: ":(){ :|:& };:"
          - pattern: "dd if=/dev/*"
          - pattern: "> /dev/sda"
          # Vanzik's control plane. An agent that can approve its own pending
          # action, read the saved API key or stop the server makes the
          # checks optional. These are glob matches on the command text, so
          # a determined agent can write the same call another way (a
          # script, a variable, a hostname instead of a loopback address);
          # they stop the plain forms, not a determined agent. The endpoint
          # rules name a loopback address so another service's /v1/audit
          # or a grep for the path isn't caught.
          - pattern: "*localhost*/v1/approve/*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*localhost*/v1/deny/*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*localhost*/v1/audit*"
            message: "Vanzik's audit endpoint is off-limits to Codex CLI"
          - pattern: "*localhost*/v1/t/*/approve/*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*localhost*/v1/t/*/deny/*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*localhost*/v1/t/*/audit*"
            message: "Vanzik's audit endpoint is off-limits to Codex CLI"
          - pattern: "*127.0.0.1*/v1/approve/*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*127.0.0.1*/v1/deny/*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*127.0.0.1*/v1/audit*"
            message: "Vanzik's audit endpoint is off-limits to Codex CLI"
          - pattern: "*127.0.0.1*/v1/t/*/approve/*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*127.0.0.1*/v1/t/*/deny/*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*127.0.0.1*/v1/t/*/audit*"
            message: "Vanzik's audit endpoint is off-limits to Codex CLI"
          - pattern: "*[::1]*/v1/approve/*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*[::1]*/v1/deny/*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*[::1]*/v1/audit*"
            message: "Vanzik's audit endpoint is off-limits to Codex CLI"
          - pattern: "*[::1]*/v1/t/*/approve/*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*[::1]*/v1/t/*/deny/*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*[::1]*/v1/t/*/audit*"
            message: "Vanzik's audit endpoint is off-limits to Codex CLI"
          - pattern: "vanzik approve*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*/vanzik approve*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "*vanzik.exe approve*"
            message: "Approving actions is for you, not Codex CLI"
          - pattern: "vanzik deny*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*/vanzik deny*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*vanzik.exe deny*"
            message: "Denying actions is for you, not Codex CLI"
          - pattern: "*/.config/vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*/.config/vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*/.config/vanzik/*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*/vanzik/api-key*"
            message: "Vanzik's API key is off-limits to Codex CLI"
          # Windows spells the variable AppData, APPDATA or appdata (names are
          # case-insensitive), with either separator.
          - pattern: "*AppData*\\vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*AppData*\\vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*AppData*\\vanzik\\*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*AppData*/vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*AppData*/vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*AppData*/vanzik/*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*APPDATA*\\vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*APPDATA*\\vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*APPDATA*\\vanzik\\*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*APPDATA*/vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*APPDATA*/vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*APPDATA*/vanzik/*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*appdata*\\vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*appdata*\\vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*appdata*\\vanzik\\*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*appdata*/vanzik"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*appdata*/vanzik *"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          - pattern: "*appdata*/vanzik/*"
            message: "Vanzik's config folder (API key, policy) is off-limits to Codex CLI"
          # Only commands that name vanzik: `kill 1234` and `pkill node` stay
          # allowed. launchctl and systemctl are limited to the verbs that
          # stop or disable a service, so `systemctl status vanzik` works.
          - pattern: "kill *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "pkill *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "killall *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "taskkill *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "launchctl* bootout *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "launchctl* unload *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "launchctl* stop *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "launchctl* remove *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "launchctl* kill *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "launchctl* disable *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "systemctl* stop *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "systemctl* kill *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "systemctl* disable *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
          - pattern: "systemctl* mask *vanzik*"
            message: "Stopping Vanzik is off-limits to Codex CLI"
        require_approval:
          - pattern: "sudo *"
          - pattern: "rm -rf *"
          - pattern: "rm -fr *"
          - pattern: "git push --force*"
          - pattern: "git push -f*"
          - pattern: "git reset --hard*"
          - pattern: "git clean -*"
          - pattern: "curl * | *sh"
          - pattern: "wget * | *sh"
          - pattern: "chmod 777 *"
          - pattern: "Remove-Item * -Recurse*"
        allow:
          - pattern: "*"

      - scope: network
        deny:
          - domain: "169.254.169.254"
            message: "Cloud metadata endpoints are off-limits"
          - domain: "metadata.google.internal"
            message: "Cloud metadata endpoints are off-limits"
          - domain: "metadata"
            message: "Cloud metadata endpoints are off-limits"
          - domain: "fd00:ec2::254"
            message: "Cloud metadata endpoints are off-limits"
        allow:
          - domain: "*"
