# ============================================================
# EXAMPLE POLICY — DO NOT DEPLOY UNMODIFIED.
# Webhook URLs and secrets in this file are placeholders.
# Replace any https://example.invalid/... URL before deploying.
# ============================================================
# Vanzik Policy: Trading Bot
# Strict guardrails for AI agents interacting with financial APIs.
#
# See docs/POLICY_REFERENCE.md. Evaluation inside a scope is:
#   deny → require_approval → allow → default DENY (first match wins).

version: "1"
name: "trading-bot-policy"
description: "Policy for AI trading agents — restricts order sizes, blocks withdrawals, requires approval for large trades"

rules:
  # --- Network: Only allow known financial APIs ---
  # Every other host falls through to the default DENY. Don't add a
  # catch-all `domain: "*"` deny: deny runs before allow, so it would
  # block the listed APIs too.
  - scope: network
    allow:
      - domain: "api.alpaca.markets"
      - domain: "*.polygon.io"
      - domain: "api.binance.com"
      - domain: "api.coingecko.com"
    # Per-instance rate limit. Divide by replica count for a global cap.
    rate_limit:
      max_requests: 30
      window: "1m"

  # --- Shell: Read-only market data scripts ---
  - scope: shell
    allow:
      - pattern: "python scripts/fetch_*.py"
      - pattern: "python scripts/analyze_*.py"
    require_approval:
      - pattern: "python scripts/execute_trade.py *"
    deny:
      - pattern: "curl *"
        message: "Use sanctioned scripts, not raw HTTP calls"
      - pattern: "pip install *"
        message: "No package installation during trading sessions"

  # --- Cost: Hard limits on trade sizes ---
  - scope: cost
    limits:
      max_per_action: "$500"
      max_per_session: "$5000"
      alert_threshold: "$250"   # must be below max_per_action, which is checked first

  # --- Filesystem: Log access only ---
  - scope: filesystem
    allow:
      - action: read
        paths: ["./data/**", "./config/**"]
      - action: write
        paths: ["./logs/**", "./output/**"]
    deny:
      - action: write
        paths: ["./config/**"]
        message: "Bots cannot modify their own configuration"
      - action: delete
        paths: ["**"]
        message: "No file deletion permitted"

notifications:
  approval_required:
    - type: webhook
      url: "https://example.invalid/REPLACE_ME_BEFORE_DEPLOY"
    - type: console
  on_deny:
    - type: webhook
      url: "https://example.invalid/REPLACE_ME_BEFORE_DEPLOY"
    - type: log
      level: error
