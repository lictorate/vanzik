name: Installer smoke test

# Installs Vanzik the way the README and vanzik.lictorate.com tell
# people to — the one-line installers and the container image — and checks
# what each leaves behind: all three binaries at the right version, a
# starter policy that validates, a rerun that keeps the operator's policy, a
# tampered archive refused, and an AgentGuard 1.x install (this project's
# name before 2.0) moved over: its folders, database and coding-agent hooks.
# Linux (x64, arm64, Alpine/busybox), macOS (Apple silicon, Intel), Windows
# (PowerShell 5.1 and 7). The checks live in scripts/installer-smoke.sh and
# scripts/installer-smoke.ps1.
#
# - After every successful "Release binaries, installers and image" run: the
#   published one-liners, against the latest release.
# - On pull requests that touch the installers or the migration: this
#   branch's scripts, installing archives built from this branch (served from
#   127.0.0.1 through VANZIK_DOWNLOAD_URL), so a broken installer or
#   migration fails before it ships.
# - By hand, in either mode.

on:
  workflow_run:
    workflows: ["Release binaries, installers and image"]
    types: [completed]
  pull_request:
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/installer-smoke.sh
      - scripts/installer-smoke.ps1
      - scripts/build-release.sh
      - cmd/vanzik/migrate_agentguard.go
      - cmd/vanzik/agent_settings.go
      - .github/workflows/installer-smoke.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "published = the public one-liners; local = this branch's installer scripts and binaries"
        type: choice
        options: [published, local]
        default: published

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODE: ${{ github.event_name == 'pull_request' && 'local' || inputs.mode || 'published' }}
  MIRROR_PORT: 8765

jobs:
  release:
    name: Version under test
    # A failed asset upload is its own red run; there is nothing to install.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The latest release, or this branch's version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = local ]; then
            v="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' cmd/vanzik/main.go | head -n1)"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            v="${tag#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Testing the $MODE installers, expecting $v"

  build:
    name: Archives from this branch
    needs: release
    if: needs.release.outputs.mode == 'local'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'   # keep in step with go.mod's go directive and ci.yml
      - name: Build the release archives
        run: scripts/build-release.sh --out dist --version "${{ needs.release.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mirror
          path: dist/

  unix:
    name: ${{ matrix.name }}
    needs: [release, build]
    # build is skipped in published mode; that is fine here.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64 (dash, non-root)", os: ubuntu-latest }
          - { name: "Linux arm64 (dash, non-root)", os: ubuntu-24.04-arm }
          - { name: "macOS Apple silicon", os: macos-latest }
          - { name: "macOS Intel", os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: needs.release.outputs.mode == 'local'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mirror
          path: mirror
      - name: Serve this branch's archives
        if: needs.release.outputs.mode == 'local'
        run: |
          python3 -m http.server "$MIRROR_PORT" --bind 127.0.0.1 --directory mirror >/dev/null 2>&1 &
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "http://127.0.0.1:$MIRROR_PORT/checksums.txt" && break; sleep 0.2; done
          echo "VANZIK_DOWNLOAD_URL=http://127.0.0.1:$MIRROR_PORT" >> "$GITHUB_ENV"
      - name: Install and check
        env:
          WANT_VERSION: ${{ needs.release.outputs.version }}
        run: sh scripts/installer-smoke.sh

  alpine:
    name: Linux x64 Alpine (busybox + wget, root)
    needs: [release, build]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: needs.release.outputs.mode == 'local'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mirror
          path: mirror
      - name: Serve this branch's archives
        if: needs.release.outputs.mode == 'local'
        run: |
          python3 -m http.server "$MIRROR_PORT" --bind 127.0.0.1 --directory mirror >/dev/null 2>&1 &
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "http://127.0.0.1:$MIRROR_PORT/checksums.txt" && break; sleep 0.2; done
          echo "VANZIK_DOWNLOAD_URL=http://127.0.0.1:$MIRROR_PORT" >> "$GITHUB_ENV"
      # --network host: the container reaches the mirror on the runner's
      # 127.0.0.1. VANZIK_DOWNLOAD_URL is empty in published mode.
      - name: Install and check
        env:
          WANT_VERSION: ${{ needs.release.outputs.version }}
        run: docker run --rm --network host -v "$PWD:/w:ro" -e MODE -e WANT_VERSION -e VANZIK_DOWNLOAD_URL alpine:3 sh /w/scripts/installer-smoke.sh

  windows:
    name: Windows (${{ matrix.engine }})
    needs: [release, build]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: needs.release.outputs.mode == 'local'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mirror
          path: mirror
      # pwsh, not powershell: Windows PowerShell 5.1 writes a BOM into
      # GITHUB_ENV, which breaks the variable's name.
      - name: Serve this branch's archives
        if: needs.release.outputs.mode == 'local'
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m', 'http.server', $env:MIRROR_PORT, '--bind', '127.0.0.1', '--directory', 'mirror' -WindowStyle Hidden
          for ($i = 0; $i -lt 50; $i++) {
              try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:MIRROR_PORT/checksums.txt" | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          "VANZIK_DOWNLOAD_URL=http://127.0.0.1:$env:MIRROR_PORT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install and check
        shell: powershell
        env:
          WANT_VERSION: ${{ needs.release.outputs.version }}
          ENGINE: ${{ matrix.engine }}
        run: ./scripts/installer-smoke.ps1 -Mode $env:MODE -Want $env:WANT_VERSION -Engine $env:ENGINE

  image:
    name: Container image
    needs: release
    # The image doesn't change with the installer scripts; PRs skip it.
    if: github.event_name != 'pull_request' && (inputs.mode || 'published') == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Run it the documented way and check the API
        env:
          WANT_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vanzik:latest"
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          v="$(docker run --rm "$image" --version)"
          [[ "$v" == *"$WANT_VERSION"* ]] || { echo "FAIL  :latest is '$v', expected $WANT_VERSION"; exit 1; }
          echo "PASS  :latest is $v"

          # Without a key the server binds to 127.0.0.1 inside the container,
          # so the documented command supplies one — made here the way
          # vanzik.lictorate.com's Docker tab makes it when none is set.
          export VANZIK_API_KEY="${VANZIK_API_KEY:-$(openssl rand -hex 32)}"
          docker run -d --name vanzik -p 8080:8080 \
            -e VANZIK_API_KEY \
            -v vanzik-audit:/var/lib/vanzik \
            "$image" >/dev/null
          for _ in $(seq 1 30); do [ "$(status http://127.0.0.1:8080/health)" = 200 ] && break; sleep 1; done

          fail() { echo "FAIL  $1"; docker logs vanzik; exit 1; }
          [ "$(status http://127.0.0.1:8080/health)" = 200 ] || fail "/health did not answer 200"
          echo "PASS  /health answers 200"
          [ "$(status http://127.0.0.1:8080/v1/audit)" = 401 ] || fail "/v1/audit answered without a key"
          echo "PASS  /v1/audit refuses a request without the key"
          [ "$(status -H "Authorization: Bearer $VANZIK_API_KEY" http://127.0.0.1:8080/v1/audit)" = 200 ] ||
            fail "/v1/audit refused the key"
          echo "PASS  /v1/audit accepts the key"

          # A container still configured with AgentGuard 1.x's variable
          # doesn't start without its key: it refuses, naming the new one.
          if docker run --rm -e AGENTGUARD_API_KEY=old "$image" >/tmp/legacy.log 2>&1; then
            cat /tmp/legacy.log; echo "FAIL  started with only AGENTGUARD_API_KEY set"; exit 1
          fi
          grep -q VANZIK_API_KEY /tmp/legacy.log || { cat /tmp/legacy.log; echo "FAIL  the refusal doesn't name VANZIK_API_KEY"; exit 1; }
          echo "PASS  AGENTGUARD_API_KEY alone is refused"
          echo "ALL PASS"
